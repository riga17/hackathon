<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Attachments · Priority</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="attachments.css">
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="nav-slot"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="ib menu-btn" id="menu-btn" type="button" aria-label="Open menu" data-icon="grid"></button>
      <div class="ttl"><h1>Scanner</h1><p id="sub">Scan notes, receipts, or anything with text.</p></div>
      <button class="ib" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    </header>

    <!-- Scanner hero -->
    <section class="scan-hero">
      <div class="scan-zone" id="scan-zone">
        <div class="scan-frame">
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
          <div class="scan-line"></div>
          <div class="scan-icon" id="scan-icon"></div>
          <p class="scan-title" id="scan-title">Drop a photo here</p>
          <p class="scan-sub" id="scan-sub">Or click to choose a photo. We'll read the text for you.</p>
        </div>
      </div>

      <div class="scan-actions">
        <button class="btn btn-primary" id="pick-photo" type="button">Choose photo</button>
        <button class="btn" id="use-camera" type="button">Use camera</button>
      </div>

      <input type="file" id="photo-input" accept="image/*" hidden>
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
    </section>

    <!-- Scanning progress -->
    <div class="scan-progress" id="scan-progress" hidden>
      <div class="sp-head">
        <span class="sp-label">Scanning…</span>
        <span class="sp-pct" id="sp-pct">0%</span>
      </div>
      <div class="sp-bar"><i id="sp-fill"></i></div>
      <p class="sp-hint" id="sp-hint">Reading the text. This takes a few seconds.</p>
    </div>

    <!-- Tabs -->
    <div class="tab-row">
      <button class="tab on" data-tab="scans" type="button">Scanned notes</button>
      <button class="tab" data-tab="files" type="button">Other files</button>
      <button class="tab" data-tab="all" type="button">All</button>
    </div>

    <!-- Search -->
    <div class="tools">
      <label class="sr-only" for="q">Search</label>
      <input id="q" type="search" placeholder="Search by text or name…">
      <button class="btn btn-line" id="upload-btn" type="button">+ Upload file</button>
      <input type="file" id="file-input" multiple hidden>
      <span class="storage-pill" id="storage"></span>
    </div>

    <!-- Grid -->
    <div class="grid-a" id="grid"></div>

    <!-- Preview dialog -->
    <dialog id="preview">
      <div class="pv-head">
        <h2 id="pv-name"></h2>
        <button class="mini-b" id="pv-close" type="button" aria-label="Close preview">✕</button>
      </div>
      <div class="pv-body" id="pv-body"></div>
    </dialog>
  </div>
</div>
<script src="attachments.js"></script>
</body>
</html>
